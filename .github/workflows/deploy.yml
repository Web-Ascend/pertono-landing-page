name: Deploy to Checkdomain

# Läuft bei jedem Push auf main — oder manuell über den Actions-Tab.
#
# Modelliert nach dem Deploy der lets-rave Landing Page, die ebenfalls bei
# Checkdomain liegt: bauen, dann per lftp-SFTP-Mirror auf den Webspace
# spiegeln. Zwei bewusste Abweichungen:
#  - Vor dem Upload steht ein Astro-Build (lets-rave ist statisches HTML,
#    diese Site wird aus src/ gebaut; hochgeladen wird nur dist/).
#  - GitHub-gehosteter Runner statt self-hosted: dieses Repo ist öffentlich,
#    Actions-Minuten kosten hier nichts — und ein self-hosted Runner an einem
#    öffentlichen Repo wäre ein Sicherheitsrisiko (Fork-PRs).
#
# Zwei Jobs statt einem (Audit 2026-10, LP2-5): `build` führt fremden Code
# aus — npm-Pakete, Vite-Plugins, Astro-Integrationen — und besitzt deshalb
# keine Secrets und kein Environment; es baut dist/ und legt es als Artefakt
# ab. `deploy` besitzt die SFTP-Zugangsdaten aus dem Environment `production`,
# führt aber weder npm noch Node aus: es lädt nur das Artefakt und spiegelt
# es. Ein kompromittiertes Paket kann so zwar den Inhalt des Builds verändern
# (das fängt kein Workflow ab), aber nicht mehr nebenher die Zugangsdaten
# lesen, mit denen der Build hochgeladen wird — vorher liefen beide im selben
# Job, unter demselben Benutzer, mit den Secrets in den Step-Umgebungen.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Deploys nicht parallel laufen lassen; einen LAUFENDEN Deploy nie abbrechen
# (halb gespiegelte Site). Ein wartender wird durch den neuesten ersetzt.
# Der Deploy läuft über SFTP mit eigenen Secrets — der GITHUB_TOKEN wird
# nur zum Auschecken gebraucht.
permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # ── Bauen, ohne Secrets ─────────────────────────────────────────────────
  build:
    # Versionierter Runner statt `ubuntu-latest`: ein Deploy soll heute und
    # in einem halben Jahr auf demselben Image laufen (Audit 2026-10, LP2-8i).
    runs-on: ubuntu-24.04
    # Hänger-Schutz: ohne Timeout blockiert ein hängender Step den Job bis
    # zum 6-Stunden-Default. npm ci und ein Astro-Build sind Minutensache.
    timeout-minutes: 10
    steps:
      - name: Code auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # --ignore-scripts: kein Paket in der Lockfile braucht ein Install-Skript
      # (sharp bringt seine Binaries als vorgebaute optionale Pakete mit), also
      # bekommt auch keines die Gelegenheit, beim Installieren Code auszuführen.
      # Identisch zu pr-check.yml — laufen die beiden auseinander, prüft der
      # Pull Request etwas anderes als das, was hier ausgeliefert wird.
      - run: npm ci --ignore-scripts

      - name: Type-check
        run: npm run check

      - name: Build
        run: npm run build

      # ── Jeden in der CSP erlaubten Script-Host erreichen ──
      # Anlass (Audit 2026-10, LP2-2): Die CSP erlaubte wochenlang einen Host,
      # den es im DNS nicht gab — jede Seite lud ein Skript ins Leere, und die
      # Origin hätte jeder übernehmen können, der den Record als Erster setzt.
      # Ein Script-Host, der nicht per HTTPS antwortet, ist deshalb ein
      # Deploy-Abbruch, kein Schönheitsfehler. Gelesen wird die CSP aus
      # dist/.htaccess — das, was gleich hochgeladen wird. Erlaubt die CSP
      # keine fremde Origin (`script-src 'none'`), gibt es nichts zu prüfen.
      - name: CSP-Script-Hosts prüfen
        run: |
          set -uo pipefail
          csp="$(grep -oE 'Content-Security-Policy "[^"]*"' dist/.htaccess | head -1 | sed 's/^[^"]*"//; s/"$//')"
          [ -n "$csp" ] || { echo "::error::dist/.htaccess: keine Content-Security-Policy gefunden"; exit 1; }
          directives="$(printf '%s' "$csp" | tr ';' '\n' | sed 's/^ *//; s/ *$//')"
          # script-src gilt; fehlt die Direktive, greift default-src.
          dir="$(printf '%s\n' "$directives" | grep -E '^script-src( |$)' || true)"
          [ -n "$dir" ] || dir="$(printf '%s\n' "$directives" | grep -E '^default-src( |$)' || true)"
          echo "Geprüfte Direktive: ${dir:-<keine>}"
          hosts="$(printf '%s\n' "$dir" | tr ' ' '\n' | grep -E '^https://' | sed -E 's#^(https://[^/]+).*#\1#' | sort -u || true)"
          if [ -z "$hosts" ]; then
            echo "CSP erlaubt keine fremden Script-Hosts — nichts zu prüfen."
            exit 0
          fi
          fail=0
          for host in $hosts; do
            case "$host" in
              *'*'*) echo "::error::CSP-Script-Host $host enthält ein Wildcard — nicht prüfbar und zu weit gefasst"; fail=1; continue;;
            esac
            if code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$host/" 2>"$RUNNER_TEMP/curl.err")"; then
              echo "$host antwortet (HTTP $code)."
            else
              echo "::error::CSP-Script-Host $host ist per HTTPS nicht erreichbar: $(cat "$RUNNER_TEMP/curl.err") — Skript-Tag, CSP und Datenschutzerklärung müssen zusammenpassen; entweder den Host betreiben oder die Einbindung entfernen."
              fail=1
            fi
          done
          [ "$fail" = "0" ] || exit 1

      # Dotfiles ausdrücklich mitnehmen: .htaccess und .well-known/ sind der
      # Teil des Builds, den der Deploy separat hochlädt — ein Artefakt ohne
      # sie wäre ein grüner Build mit totem Deeplink und alter Hoster-.htaccess.
      - name: Build als Artefakt ablegen
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # ── Hochladen, ohne Node ────────────────────────────────────────────────
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    # Die SFTP-Secrets liegen als Environment-Secrets in `production`, nicht
    # als Repo-Secrets: das Repo ist öffentlich, und über die Deployment-
    # Branch-Regel des Environments (nur main) kommt kein Workflow auf einem
    # Seitenbranch an die Zugangsdaten heran.
    environment:
      name: production
      url: https://pertono.com
    timeout-minutes: 15
    steps:
      # Kein Checkout, kein npm: dieser Job kennt nur das Artefakt.
      - name: Build-Artefakt laden
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Artefakt vollständig?
        run: |
          set -u
          for f in dist/index.php dist/.htaccess dist/.well-known/assetlinks.json dist/.well-known/apple-app-site-association; do
            [ -f "$f" ] || { echo "::error::$f fehlt im Artefakt — ohne include-hidden-files oder ohne Build?"; exit 1; }
          done
          echo "Artefakt vollständig."

      # ── Vorab prüfen, dass die SFTP-Secrets gesetzt sind ──
      # Ohne diesen Check scheitert lftp mit kryptischen Meldungen — z. B.
      # "Bad port", weil ein leeres Port-Secret den Befehl zerschießt.
      # SFTP_REMOTE_PATH ist hier zusätzlich ein Secret (bei lets-rave steht
      # der Pfad im Klartext im Workflow): dieses Repo ist öffentlich, und der
      # vhost-Pfad verrät den internen Checkdomain-Hostnamen.
      - name: SFTP-Secrets prüfen
        env:
          SFTP_HOST:        ${{ secrets.SFTP_HOST }}
          SFTP_USER:        ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD:    ${{ secrets.SFTP_PASSWORD }}
          SFTP_PORT:        ${{ secrets.SFTP_PORT }}
          SFTP_REMOTE_PATH: ${{ secrets.SFTP_REMOTE_PATH }}
          SFTP_KNOWN_HOSTS: ${{ secrets.SFTP_KNOWN_HOSTS }}
        run: |
          missing=""
          [ -z "$SFTP_HOST" ]        && missing="$missing SFTP_HOST"
          [ -z "$SFTP_USER" ]        && missing="$missing SFTP_USER"
          [ -z "$SFTP_PASSWORD" ]    && missing="$missing SFTP_PASSWORD"
          [ -z "$SFTP_PORT" ]        && missing="$missing SFTP_PORT"
          [ -z "$SFTP_REMOTE_PATH" ] && missing="$missing SFTP_REMOTE_PATH"
          # Auch hier, nicht erst beim Upload: ein fehlender Host-Key soll nach
          # Sekunden abbrechen, nicht nach dem ganzen Build.
          [ -z "$SFTP_KNOWN_HOSTS" ] && missing="$missing SFTP_KNOWN_HOSTS"
          if [ -n "$missing" ]; then
            echo "::error::Fehlende SFTP-Secrets:$missing — als Environment-Secrets im Environment 'production' anlegen (siehe README)"
            exit 1
          fi

      - name: lftp installieren
        run: |
          if ! command -v lftp >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          fi
          lftp --version | head -1

      # ── Per SFTP zu Checkdomain spiegeln ──
      # lftp mirror --reverse --delete macht einen echten Abgleich: lädt nur
      # geänderte Dateien hoch und entfernt auf dem Server nur die verwaisten
      # (umbenannte/gelöschte). Der Zielordner selbst bleibt erhalten.
      # Dotfiles/-ordner werden ausgeschlossen — server-seitige wie
      # .well-known werden weder hochgeladen noch gelöscht, damit z. B.
      # SSL/Let's-Encrypt nicht zerschossen wird.
      # Die .htaccess wird im Anschluss separat hochgeladen (einzelner put,
      # kein delete, wie bei lets-rave): der Dotfile-Schutz bleibt für alles
      # andere erhalten, aber unsere .htaccess ersetzt die alte des Hosters —
      # die leitete / auf die gelöschte /de/-Site um und würde sonst jeden
      # Deploy überleben.
      #
      # assetlinks.json und die apple-app-site-association liegen in
      # .well-known/ — auch ein Dotordner, den der Mirror ausschließt. Sie
      # brauchen dieselbe Extrabehandlung wie die .htaccess: mkdir -f (falls der
      # Ordner noch nicht existiert) und je ein put. Ohne sie ist der Deploy
      # grün und der App-Deeplink tot. Der Schritt danach prüft, dass sie
      # tatsächlich erreichbar sind.
      - name: SFTP Mirror Deploy
        env:
          SFTP_HOST:        ${{ secrets.SFTP_HOST }}
          SFTP_USER:        ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD:    ${{ secrets.SFTP_PASSWORD }}
          SFTP_PORT:        ${{ secrets.SFTP_PORT }}
          SFTP_KNOWN_HOSTS: ${{ secrets.SFTP_KNOWN_HOSTS }}
          REMOTE_PATH:      ${{ secrets.SFTP_REMOTE_PATH }}
        run: |
          # ── Host-Key-Verifikation (Schutz gegen MITM auf dem Deploy-Kanal) ──
          # Ist das Secret SFTP_KNOWN_HOSTS gesetzt (Ausgabe von
          #   ssh-keyscan -p <SFTP_PORT> <SFTP_HOST>), wird der Host-Key streng
          # geprüft. Ohne das Secret bricht der Deploy ab.
          if [ -n "$SFTP_KNOWN_HOSTS" ]; then
            KH="$RUNNER_TEMP/known_hosts"
            printf '%s\n' "$SFTP_KNOWN_HOSTS" > "$KH"
            SFTP_VERIFY=$(printf 'set sftp:auto-confirm no\nset sftp:connect-program "ssh -a -x -o StrictHostKeyChecking=yes -o UserKnownHostsFile=%s -o GlobalKnownHostsFile=/dev/null"' "$KH")
          else
            # Abbruch statt Warnung: eine Warnung, die niemand liest, ist von
            # einem Deploy, der jedem antwortenden Host vertraut, nicht zu
            # unterscheiden (Review 2026-09, CI-7).
            echo "::error::SFTP_KNOWN_HOSTS nicht gesetzt — Deploy ohne Host-Key-Verifikation wird verweigert. Absichern: 'ssh-keyscan -p <SFTP_PORT> <SFTP_HOST>' ausführen und die Ausgabe als Secret SFTP_KNOWN_HOSTS in der Umgebung hinterlegen."
            exit 1
          fi

          lftp sftp://"$SFTP_HOST":"$SFTP_PORT" <<EOF
          $SFTP_VERIFY
          set net:max-retries 2
          set net:timeout 20
          user "$SFTP_USER" "$SFTP_PASSWORD"
          mirror --reverse --delete --verbose --exclude "^\." ./dist/ "$REMOTE_PATH"
          put -O "$REMOTE_PATH" ./dist/.htaccess
          mkdir -f "$REMOTE_PATH/.well-known"
          put -O "$REMOTE_PATH/.well-known" ./dist/.well-known/assetlinks.json
          put -O "$REMOTE_PATH/.well-known" ./dist/.well-known/apple-app-site-association
          bye
          EOF

      # ── Deeplink-Endpunkte gegen die Live-Site prüfen ──
      # Ein Deeplink, der lautlos aufhört zu funktionieren, gehört in dieselbe
      # Kategorie wie eine stille Regression: hier zugesichert statt geglaubt.
      # Geprüft wird die Infrastruktur — erreichbar, richtiger Content-Type,
      # gültiges JSON, und dass der Redirect den Code trägt. Der Fingerprint
      # bzw. die Team ID selbst sind ohne Gerät nicht prüfbar; steht dort noch
      # ein Platzhalter, warnt der Schritt, bricht aber nicht ab (die App-Bindung
      # scheitert dann bewusst geschlossen — der Link öffnet im Browser).
      - name: Deeplink-Endpunkte prüfen
        run: |
          set -uo pipefail
          base="https://pertono.com"
          fail=0
          err() { echo "::error::$1"; fail=1; }
          warn() { echo "::warning::$1"; }

          # Security-Header: Genau dafür laufen die Seiten als index.php durch
          # Apache (scripts/wrap-php.mjs). Fehlt einer in der Antwort auf /,
          # liefert nginx wieder direkt aus oder Apache übernimmt die .htaccess
          # nicht — beides muss auffallen.
          code="$(status_of_headers() { curl -sS -o /dev/null -D /tmp/h -w '%{http_code}' "$1"; }; status_of_headers "$base/")"
          [ "$code" = "200" ] || err "Startseite: HTTP $code statt 200"
          for h in content-security-policy strict-transport-security x-frame-options x-content-type-options; do
            grep -qi "^$h:" /tmp/h || err "Startseite: Header $h fehlt — läuft die Seite durch Apache/PHP? (DirectoryIndex index.php, PHP aktiv?)"
          done

          status_of() { curl -sS -o "$2" -D /tmp/h -w '%{http_code}' "$1"; }
          ct_of() { tr -d '\r' < /tmp/h | awk -F': ' 'tolower($1)=="content-type"{print tolower($2)}'; }

          # assetlinks.json (Android): 200, application/json, gültiges JSON, Paket.
          code="$(status_of "$base/.well-known/assetlinks.json" /tmp/al.json)"
          ct="$(ct_of)"
          [ "$code" = "200" ] || err "assetlinks.json: HTTP $code statt 200 — kam der put an?"
          case "$ct" in *application/json*) ;; *) err "assetlinks.json: Content-Type '$ct' ist nicht application/json";; esac
          jq -e '.[0].target.package_name == "com.webascend.pertono"' /tmp/al.json >/dev/null 2>&1 \
            || err "assetlinks.json: package_name fehlt/falsch oder kein gültiges JSON"
          grep -q REPLACE_WITH_PLAY_APP_SIGNING /tmp/al.json 2>/dev/null \
            && warn "assetlinks.json trägt noch den Platzhalter — App Links verifizieren erst mit dem echten SHA-256 des Play-App-Signing-Zertifikats."

          # apple-app-site-association (iOS): 200, application/json (per ForceType), JSON.
          code="$(status_of "$base/.well-known/apple-app-site-association" /tmp/aasa.json)"
          ct="$(ct_of)"
          [ "$code" = "200" ] || err "apple-app-site-association: HTTP $code statt 200"
          # Nur eine Warnung, kein Abbruch: iOS ist noch dormant, und ob
          # ForceType auf dem Shared Hosting greift, ist ungewiss — ein falscher
          # Content-Type für einen ruhenden Pfad soll den aktiven Deploy nicht
          # rot machen. Steht iOS an, muss das grün sein.
          case "$ct" in *application/json*) ;; *) warn "apple-app-site-association: Content-Type '$ct' ist nicht application/json — ForceType greift auf diesem Host nicht; vor dem iOS-Start lösen.";; esac
          jq -e '.applinks.details[0].paths | index("/einladung/*")' /tmp/aasa.json >/dev/null 2>&1 \
            || err "apple-app-site-association: /einladung/* fehlt oder kein gültiges JSON"
          grep -q REPLACE_WITH_APPLE_TEAM_ID /tmp/aasa.json 2>/dev/null \
            && warn "apple-app-site-association trägt noch den Platzhalter — Universal Links greifen erst mit der echten Apple Team ID."

          # Redirect (Fall ohne App): 302 auf die Web-App, Code als Query.
          code="$(status_of "$base/einladung/TESTCODE-1234" /dev/null)"
          loc="$(tr -d '\r' < /tmp/h | awk -F': ' 'tolower($1)=="location"{print $2}')"
          [ "$code" = "302" ] || err "Einladungs-Redirect: HTTP $code statt 302"
          [ "$loc" = "https://app.pertono.com/?invite=TESTCODE-1234" ] \
            || err "Einladungs-Redirect zeigt auf '$loc' statt auf die Web-App mit dem Code"

          [ "$fail" = "0" ] || { echo "Deeplink-Prüfung fehlgeschlagen."; exit 1; }
          echo "Deeplink-Endpunkte OK."

      # Die Header gibt es nur, wenn der Host die .htaccess auswertet — und nur
      # einmal, wenn er sie nicht zusätzlich selbst setzt. Zwei gleichnamige
      # Header sind eine Policy, die der Browser schneidet oder ignoriert.
      # Beides lässt sich nur an der Live-Antwort prüfen (Review 2026-09, W-1).
      - name: Security-Header prüfen
        run: |
          set -uo pipefail
          fail=0
          curl -sS -o /dev/null -D /tmp/sh "https://pertono.com/" \
            || { echo "::error::pertono.com antwortet nicht"; exit 1; }
          tr -d '\r' < /tmp/sh > /tmp/sh.lf
          for name in strict-transport-security content-security-policy x-frame-options \
                      x-content-type-options referrer-policy permissions-policy; do
            n="$(grep -ci "^$name:" /tmp/sh.lf || true)"
            if [ "$n" != "1" ]; then
              echo "::error::$name wird ${n}-mal gesendet — erwartet genau einmal (greift mod_headers, setzt der Host ihn zusätzlich?)"
              fail=1
            fi
          done
          [ "$fail" = "0" ] || exit 1
          echo "Security-Header OK."

      # ── HTTP → HTTPS (Audit 2026-10, LP2-3) ──
      # Die Umleitung steht in der .htaccess und gilt damit nur für das, was
      # Apache ausliefert — die Seiten (index.php). Statische Dateien, die
      # nginx am Apache vorbei ausliefert (PDF, DOCX, CSS, Fonts), erfasst sie
      # nicht; das geht nur beim Hoster (LP2-4). Hier wird geprüft, was die
      # .htaccess leisten kann: die Startseite über HTTP muss 301 auf die
      # HTTPS-Startseite liefern, und HTTPS selbst darf nicht umleiten — eine
      # Schleife (Apache sieht hinter einem Proxy kein HTTPS) wäre sonst ein
      # Totalausfall mit grünem Build. www ist nur eine Warnung: der Hostname
      # gehört dem Hoster, nicht der .htaccess.
      - name: HTTP-zu-HTTPS-Umleitung prüfen
        run: |
          set -uo pipefail
          fail=0
          check() { # $1 URL, $2 erwarteter Code, $3 erwartetes Location (leer = egal), $4 error|warning
            local url="$1" want="$2" wantloc="$3" level="$4" code loc
            if ! code="$(curl -sS -o /dev/null -D /tmp/rh -w '%{http_code}' --max-time 20 "$url")"; then
              echo "::$level::$url antwortet nicht"; [ "$level" = error ] && fail=1; return
            fi
            loc="$(tr -d '\r' < /tmp/rh | awk -F': ' 'tolower($1)=="location"{print $2}')"
            if [ "$code" != "$want" ]; then
              echo "::$level::$url: HTTP $code statt $want${loc:+ (Location: $loc)} — greift die HTTPS-Regel in der .htaccess?"
              [ "$level" = error ] && fail=1; return
            fi
            if [ -n "$wantloc" ] && [ "$loc" != "$wantloc" ]; then
              echo "::$level::$url leitet auf '$loc' statt auf $wantloc um"
              [ "$level" = error ] && fail=1; return
            fi
            echo "$url → HTTP $code${loc:+ → $loc}"
          }
          check "http://pertono.com/"            301 "https://pertono.com/"            error
          check "http://pertono.com/preise/"     301 "https://pertono.com/preise/"     error
          check "https://pertono.com/"           200 ""                                error
          check "http://www.pertono.com/"        301 "https://pertono.com/"            warning
          check "https://www.pertono.com/"       301 "https://pertono.com/"            warning
          [ "$fail" = "0" ] || exit 1
          echo "HTTP-zu-HTTPS-Umleitung OK."
