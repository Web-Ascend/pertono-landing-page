name: Secret Scan

# SEC-8 (Security-Audit 2026-10-22): kein Secret-Scan in der CI. gitleaks
# prueft jeden PR (seine Commits und den Stand) und jeden Push auf main.
# Ausnahmen mit Begruendung in .gitleaks.toml.
#
# Bewusst ohne gitleaks-action (verlangt fuer Organisationen eine Lizenz):
# Release-Binary mit gepinnter Pruefsumme. Der Job braucht keine Secrets und
# nur Leserecht; PRs laufen in der PR-Sandbox bzw. GitHub-hosted, Pushes auf
# main GitHub-hosted (kein Eintrag in der trusted-Runner-Gruppe noetig).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false && vars.PR_RUNNER_LABELS && fromJSON(vars.PR_RUNNER_LABELS) || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: gitleaks installieren (8.24.3, Pruefsumme gepinnt)
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) arch=x64; sum=9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c ;;
            aarch64|arm64) arch=arm64; sum=5f2edbe1f49f7b920f9e06e90759947d3c5dfc16f752fb93aaafc17e9d14cf07 ;;
            *) echo "::error::Unbekannte Architektur $(uname -m)"; exit 1 ;;
          esac
          tgz="gitleaks_8.24.3_linux_${arch}.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/$tgz"
          echo "$sum  $RUNNER_TEMP/$tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      - name: Neue Commits pruefen
        # Auch ein Secret, das im selben PR wieder entfernt wurde, steht in der
        # History und gilt als geleakt.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            range="$BASE_SHA..$HEAD_SHA"
          else
            range="-1 $HEAD_SHA"
          fi
          echo "Commit-Bereich: $range"
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --exit-code 1 --log-opts="$range" .

      - name: Stand pruefen (alle Dateien)
        run: '"$RUNNER_TEMP/gitleaks" dir --no-banner --redact --exit-code 1 .'
